<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Newsletter | FISH at UVA</title>
    <meta
            name="description"
            content="Read past issues of Catch of the Week, the newsletter from Frugal Innovations in Sustainable Healthcare at UVA."
    />
    <link rel="canonical" href="https://frugal-innovations.com/newsletter/" />
    <meta property="og:site_name" content="FISH at UVA" />

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" type="image/png" href="/assets/brand/fish-main.png" />
</head>

<body>
<div data-include="/partials/site-header.html"></div>

<main class="page">
    <section class="nl-hero">
        <div class="container nl-hero__inner">
            <p class="nl-eyebrow">Newsletter</p>
            <h1 class="nl-hero__title">Catch of the Week</h1>
            <p class="nl-hero__sub">
                Our regular roundup of what's happening at FISH: events, project updates,
                Make-A-Thon news, and ways to get involved.
            </p>
        </div>
    </section>

    <section class="nl-index" id="all-issues">
        <div class="container">
            <h2 class="nl-index__heading">All Issues</h2>

            <div class="nl-list" data-newsletter-list></div>

            <div class="nl-empty" data-newsletter-empty hidden>
                <div class="nl-empty__card">
                    <h3>No issues yet</h3>
                    <p>Once entries are added to <code>/newsletter/newsletters.json</code>, they'll show up here.</p>
                </div>
            </div>
        </div>
    </section>
</main>

<div data-include="/partials/contact-strip.html"></div>
<div data-include="/partials/site-footer.html"></div>

<script src="/js/nav.js" defer></script>
<script src="/js/promo.js" defer></script>
<script src="/js/includes.js" defer></script>
<script src="/js/newsletter-index.js" defer></script>
</body>
</html>
